name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          AUTH_SESSION_SECRET: ci-placeholder-session-secret-32chars
          MFA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          PATIENT_REGISTRATION_ENABLED: "false"

  appointment-pg-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appointments"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npx tsx --test --test-concurrency=1 src/lib/appointments/booking.pg.test.ts src/lib/appointments/lifecycle.pg.test.ts src/lib/notifications/dispatcher.pg.test.ts src/lib/identity/schema.pg.test.ts
        env:
          APPOINTMENT_PG_URL: postgres://postgres:postgres@localhost:5432/appointments
          AUTH_SESSION_SECRET: ci-placeholder-session-secret-32chars
          MFA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          PATIENT_REGISTRATION_ENABLED: "false"

